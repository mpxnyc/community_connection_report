project:
  type: book



execute: 
  messages: false
  warning: false
  echo: true
title-block-style: none

bibliography: "__const/bibliography.bib"


book:
  title: "Host or travel"
  subtitle: "Findings of the MPX NYC Study on the social and sexual connections of LGBTQ New Yorkers [CHECK SIMULATION REPS]"
  page-footer: 
    left: "Copyright 2025, MPX NYC" 
    right: 
      - icon: github
        href: https://github.com/
  chapters:
  - "index.qmd"
  - part: "Background"
    chapters: 
      - "1_introduction/1_introduction.qmd"
      - "1_introduction/1_introduction_literature_review.qmd"
  - part: "Methods"
    chapters:
      - "2_methods/2_1_methods_community_engagement.qmd"
      - "2_methods/2_2_methods_data.qmd"
      - "2_methods/2_3_methods_measures.qmd"
      - "2_methods/2_4_methods_statistical_analysis.qmd"
  - part: "Results"
    chapters:
      - "3_results/3_1_results_participants.qmd"
      - "3_results/3_2_results_contact_venues.qmd"
      - "3_results/3_3_results_movement.qmd"
      - "3_results/3_4_results_spatial_mixing.qmd"
      - "3_results/3_5_results_hypothetical_intervention.qmd"
  - part: "Discussion"
    chapters:
      - "4_discussion/4_discussion.qmd"
      - "4_discussion/4_discussion_recommendations.qmd"
  - part: "References"
    chapters:
      - "10_references/10_references.qmd"
  - part: "8_acknowledgements/8_2_about_us.qmd"
    chapters:
    - "8_acknowledgements/8_2_about_us.qmd"
  appendices: 
      - "5_methods_appendix/5_methods_appendix.qmd"
      - "6_results_appendix/6_results_appendix.qmd"
      - "7_questionnaire_appendix/7_questionnaire.qmd"
      - "9_causal_inference_framework/9_causal_inference_framework.qmd"

  sidebar:
    title: " "
    style: floating
    collapse-level: 1
    logo: "R_resources/image_mpxny.png"
format:
  html:
    font: "Helvetica Neue"
    theme: "__const/custom_theme.css"
    code-fold: true
    code-overflow: wrap
    code-tools: 
      source: false
    code-block-bg: true
    code-block-border-left: "#FF99C5"
    code-link: true
comments:
  hypothesis: true


