project:
  type: book
  
pdf-engine: pdflatex

execute: 
  messages: false
  warning: false
  echo: true
  cache: true
  
preview: 
  watch-inputs: true
    
format:
  html:
    font: "Helvetica Neue"
    theme: "_const/custom_theme.css"
    code-fold: true
    code-overflow: wrap
    code-tools: 
      source: false
    code-block-bg: true
    code-block-border-left: "#FF99C5"
    code-link: true
    number-depth: 3
    
comments:
  hypothesis: true
  

bibliography: "_const/bibliography.bib"
reference-location: margin
citation-location: margin

title-block-style: none

crossref:
  appendix-title: " "
  appendix-delim: " -"


book:
  title: "community and connection"
  subtitle: "a study on social connection among LGBTQ+ New Yorkers"
  google-analytics: "G-8EDGL4274R"
  cookie-consent: true
  page-footer: 
    left: "Copyright 2025, RESPND-MI" 
    right: 
      - icon: github
        href: https://github.com/
  sidebar:
    title: " "
    style: floating
    collapse-level: 1
    logo: "_const/images/image_mpxnyc.png"
    
  chapters:
  - "index.qmd"
  appendices: 
      - "A_ssnac1_social_spatial_context/A__ssnac1_social_spatial_context.qmd"
      - "C_sscan3_causal_interpretation/C__sscan3_causal_interpretation.qmd"
      - "B_ssnac2_network_analysis/B__ssnac2_network_analysis.qmd"
      #- "D_survey_instrument/D__survey_instrument.qmd"
      #- "F_community_engagement/F__community_engagement.qmd"
      #- "E_marketing_comm/E__marketing_comm.qmd"
      #- "G_supplementary_results/G__supplementary_results.qmd"


      
      


