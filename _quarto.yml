project:
  type: book
  
pdf-engine: pdflatex

    
execute: 
  messages: false
  warning: false
  echo: true
  cache: true
  
preview: 
  watch-inputs: true
    
    
    
    
format:
  html:
    include-in-header:
      text: |
        <style>
        .quarto-title-meta-heading { display: none; }
        .quarto-title-meta-contents { display: none; }
        </style>
    title-block-style: none
    embed-resources: false
    font: "Helvetica Neue"
    grid: 
      gutter-width: 3.5em
    theme: "_const/custom_theme.scss"
    code-fold: true
    code-overflow: wrap
    code-tools: 
      source: false
      toggle: true
    code-block-bg: true
    code-block-border-left: "#FF99C5"
    code-link: true
    number-depth: 3
    crossrefs-hover: true

  

bibliography: "_const/bibliography.bib"
reference-location: margin
citation-location: margin

title-block-style: none

crossref:
  appendix-title: " "
  appendix-delim: " -"


book:
  bread-crumbs: true
  google-analytics: "G-8EDGL4274R"
  cookie-consent: true
  page-footer: 
    left: "Copyright 2025, RESPND-MI" 
    right: 
      - icon: github
        href: https://github.com/KeletsoMakofane/mpxnyc-report
  sidebar:
    search: true
    title: " "
    style: floating
    collapse-level: 1
    logo: "_const/images/image_mpxnyc.png"
    
  chapters:
  - "index.qmd"
  - part: "Background"
    chapters:
    - "1_introduction/1_1__introduction_part2.qmd"
    - "1_introduction/1_0__introduction_part_1.qmd"
  - part: "Methods"
    chapters:
    - "2_methods/2_2_methods_data.qmd"
    - "2_methods/2_3_methods_measures.qmd"
    - "2_methods/2_4_methods_statistical_analysis.qmd"
  - part: "Results"
    chapters:
      - "3_results/3_1__results_participants.qmd"
      - "3_results/3_2__results_gatherings.qmd"
      - "3_results/3_3__results_movement.qmd"
      - "3_results/3_4__results_mixing.qmd"
      - "3_results/3_5__results_outbreak_control.qmd"
  - part: "Discussion"
    chapters:
      - "4_discussion/4_discussion.qmd"
  appendices: 
      - "A_ssnac1_context/A__ssnac1_context.qmd"
      - "B_ssnac2_description/B__ssnac2_description.qmd"
      - "C_ssnac3_causality/C__ssnac3_causality.qmd"
      - "F_organizing/F__organizing.qmd"
      - "E_marketing_comm/E__marketing_comm.qmd"
      - "D_ssnac3_measurement/D__ssnac3_measurement.qmd"
      - "G_supplementary_results/G__supplementary_results.qmd"



    

