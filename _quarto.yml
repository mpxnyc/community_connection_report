project:
  type: book

execute: 
  messages: false
  warning: false
  echo: true

format:
  html:
    font: "Helvetica Neue"
    theme: "const/custom_theme.css"
    code-fold: true
    code-overflow: wrap
    code-tools: 
      source: false
    code-block-bg: true
    code-block-border-left: "#FF99C5"
    code-link: true
    number-depth: 2
    
comments:
  hypothesis: true

bibliography: "const/bibliography.bib"

title-block-style: none


book:
  title: "travel or host?"
  subtitle: "a study on social connecton among LGBTQ New Yorkers"
  page-footer: 
    left: "Copyright 2025, MPX NYC" 
    right: 
      - icon: github
        href: https://github.com/
  sidebar:
    title: " "
    style: floating
    collapse-level: 1
    logo: "const/images/image_mpxny.png"
    
  chapters:
  - "index.qmd"
  - part: "Background"
    chapters: 
      - "1_introduction/1_1_introduction_new_crisis.qmd"
      - "1_introduction/1_2_introduction_community_response.qmd"
      - "1_introduction/1_3_introduction_what_we_know.qmd"
  - part: "Methods"
    chapters:
      - "2_methods/2_2_methods_data.qmd"
      - "2_methods/2_3_methods_measures.qmd"
      - "2_methods/2_4_methods_statistical_analysis.qmd"
  - part: "Results"
    chapters:
      - "3_results/3_1_results_participants.qmd"
      - "3_results/3_2_results_contact_venues.qmd"
      - "3_results/3_3_results_movement.qmd"
      - "3_results/3_5_results_hypothetical_intervention.qmd"
  - part: "Discussion"
    chapters:
      - "4_discussion/4_discussion.qmd"
      - "4_discussion/4_discussion_recommendations.qmd"
  - part: "References"
    chapters:
      - "10_references/10_references.qmd"
  - part: "About us"
    chapters:
    - "8_acknowledgements/8_2_about_us.qmd"
  appendices: 
      - "5_methods_appendix/5_methods_appendix.qmd"
      - "7_questionnaire_appendix/7_questionnaire.qmd"
      - "6_results_appendix/6_results_appendix.qmd"


