project:
  type: book

execute: 
  messages: false
  warning: false
  echo: true
  cache: false
  
preview: 
  watch-inputs: true
    
format:
  html:
    font: "Helvetica Neue"
    theme: "_const/custom_theme.css"
    code-fold: true
    code-overflow: wrap
    code-tools: 
      source: false
    code-block-bg: true
    code-block-border-left: "#FF99C5"
    code-link: true
    number-depth: 3
  pdf: 
    documentclass: scrreprt
    
comments:
  hypothesis: true

bibliography: "_const/bibliography.bib"

title-block-style: none


book:
  title: "host or travel?"
  subtitle: "a study on social connecton among LGBTQ New Yorkers"
  page-footer: 
    left: "Copyright 2025, MPX NYC" 
    right: 
      - icon: github
        href: https://github.com/
  sidebar:
    title: " "
    style: floating
    collapse-level: 1
    logo: "_const/images/image_mpxnyc.png"
    
  chapters:
  - "index.qmd"
  - part: "Background"
    chapters: 
      - "1_introduction/1_1__intro_outbreak_to_epidemic.qmd"
      - "1_introduction/1_2__intro_our_response.qmd"
      - "1_introduction/1_3__intro_related_research.qmd"
  - part: "Methods"
    chapters:
      - "2_methods/2_2_methods_data.qmd"
      - "2_methods/2_3_methods_measures.qmd"
      - "2_methods/2_4_methods_statistical_analysis.qmd"
  - part: "Results"
    chapters:
      - "3_results/3_1__results_participants.qmd"
      - "3_results/3_2__results_contact_venues.qmd"
      - "3_results/3_3__results_movement.qmd"
      - "3_results/3_4__results_mixing.qmd"
      - "3_results/3_5__results_outbreak_control.qmd"
  - part: "Conclusion"
    chapters:
      - "4_discussion/4_discussion.qmd"
      - "4_discussion/4_discussion_recommendations.qmd"
  - part: "Endnotes"
    chapters:
      - "6_endnotes/6_1__references.qmd"
      - "6_endnotes/6_2__about.qmd"
  appendices: 
      - "A_ssnac1_social_spatial_context/A__ssnac1_social_spatial_context.qmd"
      - "B_ssnac2_network_analysis/B__ssnac2_network_analysis.qmd"
      - "C_sscan3_causal_interpretation/C__sscan3_causal_interpretation.qmd"
      - "D_survey_instrument/D__survey_instrument.qmd"
      - "E_marketing_comm/E__marketing_comm.qmd"
      - "F_community_engagement/F__community_engagement.qmd"
      - "G_supplementary_results/G__supplementary_results.qmd"

      
      


