
pagetitle: MPX NYC

project:
  type: book
  
pdf-engine: pdflatex

    
execute: 
  messages: false
  warning: false
  echo: true
  
preview: 
  watch-inputs: true
    
    
    
    
format:
  html:
    include-in-header:
      text: |
        <style>
        .quarto-title-meta-heading { display: none; }
        .quarto-title-meta-contents { display: none; }
        </style>
    title-block-style: none
    embed-resources: false
    font: "Helvetica Neue"
    grid: 
      gutter-width: 3.5em
    theme: "_const/custom_theme.scss"
    code-fold: true
    code-overflow: wrap
    code-tools: 
      source: false
      toggle: true
    code-block-bg: true
    code-block-border-left: "#FF99C5"
    code-link: true
    number-depth: 3
    crossrefs-hover: true

  

bibliography: "_const/bibliography.bib"
reference-location: margin
citation-location: margin

title-block-style: none

crossref:
  appendix-title: " "
  appendix-delim: " -"

book:
  repo-url: "https://github.com/mpxnyc/community_connection_report"
  repo-branch: "production"
  favicon: "_const/images/image_mpxnyc.png"
  repo-actions: [source]
  repo-link-target: "_blank"
  bread-crumbs: true
  google-analytics: "G-8EDGL4274R"
  cookie-consent: true
  page-footer: 
    left: "Copyright 2025, Ctrl+F" 
    right: 
      - icon: github
        href: "https://github.com/orgs/mpxnyc/repositories"
  sidebar:
    search: true
    title: ""
    style: floating
    collapse-level: 1
    logo: "_const/images/image_mpxnyc.png"
    
  chapters:
  - "index.qmd"
  - "contents.qmd"
  - "intro.qmd"
  - part: "Methods"
    chapters:
    - "data_methods.qmd"
    - "measures.qmd"
    - "analysis.qmd"
  - part: "Results"
    chapters:
      - "people.qmd"
      - "gatherings.qmd"
      - "movement.qmd"
      - "mixing.qmd"
      - "outbreaks.qmd"
  - part: "Discussion"
    chapters:
      - "4_discussion/4_discussion.qmd"
  appendices: 
      - "appendix_ssnac_context.qmd"
      - "B_ssnac2_description/B__ssnac2_description.qmd"
      - "C_ssnac3_causality/C__ssnac3_causality.qmd"
      - "F_organizing/F__organizing.qmd"
      - "E_marketing_comm/E__marketing_comm.qmd"
      - "D_ssnac3_measurement/D__ssnac3_measurement.qmd"
      - "G_supplementary_results/G__supplementary_results.qmd"



    

